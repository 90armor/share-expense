name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:/tmp/ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate --config prisma7.config.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only for `prisma generate`; playwright.config.ts gives the E2E server
      # its own DB (data/e2e.db).
      DATABASE_URL: file:/tmp/ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate --config prisma7.config.ts
      # Headless runs use chromium-headless-shell only. Not cached: restoring
      # takes about as long as downloading, and the apt deps install anyway.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No path filters: this is a required check, and a skipped required job
    # blocks merges. Plain `docker build` (BuildKit is the default on hosted
    # runners); no layer cache, see docs/decisions.md.
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target runner -t share-expense:ci .
      # Starts the image on an empty volume; prints `docker logs` on failure.
      - run: scripts/smoke-runner.sh share-expense:ci

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Full lockfile on purpose, not --omit=dev: prisma is a devDependency but
    # ships in the runner image. Level high: see docs/decisions.md. Reads only
    # package-lock.json, so no npm ci.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --package-lock-only --audit-level=high
