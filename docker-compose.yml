services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - ./data:/app/data
    command: npm run dev

volumes:
  node_modules:
  next_cache:
